# Supabase's free plan pauses a project that has been idle for about a week.
# Every day this reads the leaderboard AND writes a row (a keep-alive visit), so the database sees real activity.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read and write
        run: |
          KEY="sb_publishable_SH9aum38gVJjeg1UBXPXTQ_NXHOvYCR"; URL="https://djrozncpjbauqwboqcvn.supabase.co/rest/v1/rpc"
          r=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$URL/bf_leaderboard" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_game":"snake","p_limit":1}')
          w=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$URL/bf_hit" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_vid":"keepalive-github-bot","p_mobile":false,"p_ref":"keepalive","p_account":false}')
          echo "read HTTP $r, write HTTP $w"
          test "$r" = "200" && test "$w" = "200"
