# Supabase's free plan pauses a project after about a week with no activity.
# This pings the public leaderboard function every two days so the project counts as active.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 5 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the leaderboard function
        run: |
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" -X POST \
            "https://djrozncpjbauqwboqcvn.supabase.co/rest/v1/rpc/bf_leaderboard" \
            -H "apikey: sb_publishable_SH9aum38gVJjeg1UBXPXTQ_NXHOvYCR" \
            -H "Content-Type: application/json" \
            -d '{"p_game":"snake","p_limit":1}')
          echo "HTTP $code"; cat /tmp/out.json
          test "$code" = "200"
